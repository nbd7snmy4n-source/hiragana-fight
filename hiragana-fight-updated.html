<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1c"><title>ひらがなファイト！</title>
<style>
:root{color-scheme:dark;--gold:#ffd65a;--panel:#111a32;--line:#52638c}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 5%,#354a81 0,#141d39 45%,#080b16 100%);color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center}
main{width:min(850px,100%);padding:12px 0 24px}h1{text-align:center;font-size:clamp(26px,7vw,42px);margin:4px 0;text-shadow:3px 3px #a33,5px 5px #111;letter-spacing:.08em}.sub{text-align:center;color:#d9e5ff;font-size:12px;margin:0 0 12px}
.panel{background:linear-gradient(145deg,#182443ee,#0c1227f5);border:2px solid #6679a8;border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 10px 30px #0008,inset 0 0 20px #7da7ff12}.hidden{display:none!important}h2{font-size:17px;margin:0 0 10px}
.characters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.character{border:2px solid #59698d;background:linear-gradient(145deg,#293b61,#111a30);color:white;border-radius:12px;padding:8px 4px;min-height:140px;font:inherit}.character.selected{border-color:var(--gold);box-shadow:0 0 0 2px #ffd65a44,0 0 18px #ffd65a55}.portrait{height:92px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(5px 6px 0 #0008)}.portrait img{height:88px;max-width:100%;object-fit:contain;image-rendering:pixelated;transform:perspective(300px) rotateY(-8deg)}.character strong{display:block;font-size:13px}.character small{color:#c7d3ef;font-size:10px}
button{font:inherit;cursor:pointer}.primary{width:100%;border:2px solid #fff0a8;border-radius:12px;background:linear-gradient(#ffe98a,#e6a91c);color:#241600;font-weight:1000;font-size:18px;padding:14px;margin-top:12px;box-shadow:0 5px 0 #80590b}
.stage{position:relative;overflow:hidden;border:2px solid #7185b7;border-radius:14px;min-height:245px;background:linear-gradient(180deg,#182b59 0%,#27365a 60%,#59466a 61%,#161a30 100%);perspective:700px}
.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 36px,#ffffff0b 37px 39px),linear-gradient(0deg,#fff0 60%,#8ab8ff18);pointer-events:none}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:27px;height:2px;background:#a9c6ff88;box-shadow:0 10px 0 #a9c6ff18,0 20px 0 #a9c6ff12}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}.fighter-hud{background:#080d1d;border:1px solid #7185b7;border-radius:9px;padding:7px;font-size:12px}.fighter-hud b{display:block;margin-bottom:4px}.hp{height:10px;background:#30394f;border:1px solid #8493b5;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38e66e,#d6ef56);transition:width .2s}#cpuBar{background:linear-gradient(90deg,#ffb12e,#ff4e57)}
.fighter{position:absolute;bottom:26px;width:34%;height:172px;display:flex;align-items:flex-end;justify-content:center;transform-style:preserve-3d;z-index:2}.fighter.player{left:5%}.fighter.cpu{right:5%;transform:scaleX(-1)}.fighter img{height:150px;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(9px 10px 0 #0008);transform:perspective(500px) rotateY(-12deg);transition:filter .12s}
.fighter.player img{transform:perspective(500px) rotateY(-12deg)}.fighter.cpu img{transform:perspective(500px) rotateY(-12deg)}
.fighter .shadow{position:absolute;bottom:0;width:75%;height:17px;border-radius:50%;background:#0009;filter:blur(4px);z-index:-1}
.fighter.punch{animation:punch .32s ease-out}.fighter.kick{animation:kick .4s ease-out}.fighter.sword{animation:sword .48s ease-out}.fighter.hit{animation:hit .28s ease-out}.fighter.dodge{animation:dodge .32s ease-out}.fighter.skill{animation:skill .6s ease-out}
@keyframes punch{0%{translate:0 0}45%{translate:80px -8px;scale:1.08}100%{translate:0 0}}
@keyframes kick{0%{translate:0 0}35%{translate:58px -22px;rotate:-7deg}70%{translate:78px -4px;rotate:3deg}100%{translate:0 0;rotate:0}}
@keyframes sword{0%{translate:0 0}40%{translate:65px -8px;rotate:-5deg}60%{translate:75px -4px;rotate:5deg}100%{translate:0 0;rotate:0}}
@keyframes hit{0%,100%{translate:0 0}30%{translate:20px -4px;filter:brightness(2)}65%{translate:-8px 0}}@keyframes dodge{40%{translate:-42px -15px;rotate:-8deg}}@keyframes skill{30%{translate:0 -30px;scale:1.15}65%{filter:brightness(2.2)}}
.fx{position:absolute;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%) scale(.3);font-size:clamp(34px,10vw,68px);font-weight:1000;color:#fff4a4;text-shadow:3px 3px #e34b28,0 0 20px #ffe66d;opacity:0;pointer-events:none}.fx.show{animation:boom .48s ease-out}@keyframes boom{0%{opacity:0;scale:.2;rotate:-20deg}30%{opacity:1;scale:1.3;rotate:8deg}100%{opacity:0;scale:1.8;rotate:20deg}}
#status{text-align:center;min-height:25px;color:var(--gold);font-weight:900;margin:8px 0}#log{height:60px;overflow:auto;background:#070b17;border:1px solid #38496f;border-radius:8px;padding:7px;font-size:11px;color:#d4def6;line-height:1.5}
.inputrow{display:flex;gap:7px;margin-top:9px}#command{min-width:0;flex:1;border:2px solid #778bb8;background:#080d1b;color:white;border-radius:9px;padding:12px;font-size:17px}#send{border:1px solid white;border-radius:9px;background:var(--gold);color:#16100a;font-weight:900;padding:0 17px}.commands{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cmd{border:1px solid #7185b7;border-radius:8px;background:linear-gradient(#27395f,#111a30);color:white;padding:7px 10px;font-size:12px}.cmd:disabled{opacity:.35}
.skillrow{display:flex;align-items:center;gap:9px;margin-top:10px}#skill{border:2px solid #ffe69a;border-radius:9px;background:linear-gradient(#694b18,#33240f);color:#ffe58a;padding:9px 10px;font-weight:900}#skill:disabled{opacity:.35}#skillInfo{font-size:11px;color:#d5dff6}
#result{text-align:center;font-size:25px;font-weight:1000;color:var(--gold);margin:10px}.note{font-size:11px;color:#b9c8e9;line-height:1.6;margin-top:10px}
@media(max-width:390px){.panel{padding:10px}.stage{min-height:220px}.fighter{height:150px}.fighter img{height:128px}.portrait{height:80px}.portrait img{height:76px}}
</style></head><body><main><h1>⚔ ひらがなファイト！ ⚔</h1><p class="sub">ことばを入力して、相手をたおせ。</p>

let selected='dad',opponent='gyaru',running=false,pHP=100,cHP=100,streak=0,lockedUntil=0,attackLockUntil=0,skillReadyAt=0,skillUsed=false,stunnedUntil=0,buffUntil=0,babyNext=false,cpuTimer=null,skillTimer=null;
function log(s){let d=document.createElement('div');d.textContent=s;$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight}
function status(s){$('status').textContent=s}
function hud(){$('playerHpText').textContent=pHP+' / 100';$('cpuHpText').textContent=cHP+' / 100';$('playerBar').style.width=pHP+'%';$('cpuBar').style.width=cHP+'%'}
function animate(id,kind,fx){let el=$(id);el.classList.remove('punch','kick','sword','hit','dodge','skill');void el.offsetWidth;el.classList.add(kind);setTimeout(()=>el.classList.remove(kind),650);if(fx){$('fx').textContent=fx;$('fx').classList.remove('show');void $('fx').offsetWidth;$('fx').classList.add('show')}}
function finish(won){running=false;clearTimeout(cpuTimer);clearInterval(skillTimer);$('result').textContent=won?'🏆 YOU WIN！':'💥 YOU LOSE…';status('たいせん終了！');$('command').disabled=true;$('send').disabled=true;$('skill').disabled=true;document.querySelectorAll('.cmd').forEach(b=>b.disabled=true);$('startBtn').textContent='もう一度たいせん';$('selectScreen').classList.remove('hidden');$('gameScreen').classList.remove('hidden')}
document.querySelectorAll('.character').forEach(b=>b.addEventListener('click',()=>{if(running)return;selected=b.dataset.char;document.querySelectorAll('.character').forEach(x=>x.classList.toggle('selected',x===b))}));
function cpuTurn(){if(!running)return;cpuTimer=setTimeout(()=>{if(!running)return;if(Date.now()<stunnedUntil){log('CPUはひるんでいる！');cpuTurn();return}let moves=['ぱんち','きっく','ふっく'];let move=moves[Math.floor(Math.random()*moves.length)];let damage=move==='ぱんち'?6:move==='きっく'?9:8;animate('cpu','punch','ガツン！');animate('player','hit');pHP=Math.max(0,pHP-damage);log(chars[opponent].name+'の'+move+'！ '+damage+'ダメージ');hud();if(pHP<=0){finish(false);return}cpuTurn()},2300+Math.random()*700)}
function attack(cmd){if(!running)return;let now=Date.now();if(now<lockedUntil){status('クールダウン中！あと'+((lockedUntil-now)/1000).toFixed(1)+'秒');return}if(now<attackLockUntil){status('攻撃後の硬直中！');return}
if(cmd==='まえ'||cmd==='うしろ'){animate('player',cmd==='まえ'?'punch':'dodge',cmd==='まえ'?'前進！':'回避！');attackLockUntil=now+280;status(cmd==='まえ'?'前に出た！':'後ろに下がった！');return}
if(!['ぱんち','きっく','ふっく','けん'].includes(cmd)){status('そのコマンドは使えないよ');return}
let dmg={ぱんち:8,きっく:11,ふっく:13,けん:17}[cmd];if(selected==='gyaru'&&now<buffUntil)dmg=Math.round(dmg*1.5);if(selected==='baby'&&babyNext){dmg*=3;babyNext=false;log('夜泣きパワー発動！')}
let anim=cmd==='ぱんち'?'punch':cmd==='きっく'?'kick':cmd==='けん'?'sword':'punch';animate('player',anim,cmd==='けん'?'ズバッ！':'ドカッ！');animate('cpu','hit');cHP=Math.max(0,cHP-dmg);streak++;attackLockUntil=now+(cmd==='けん'?650:500);log(cmd+'！ '+chars[opponent].name+'に'+dmg+'ダメージ');hud();status('ヒット！ '+streak+'/3');if(cHP<=0){finish(true);return}if(streak>=3){streak=0;lockedUntil=Date.now()+2000;attackLockUntil=lockedUntil;status('攻撃しすぎ！2秒間硬直！')}}
function submit(){if(!running)return;let v=$('command').value.trim().replace(/\s/g,'');$('command').value='';if(v)attack(v);$('command').focus()}
$('startBtn').addEventListener('click',()=>{clearTimeout(cpuTimer);clearInterval(skillTimer);pHP=100;cHP=100;streak=0;lockedUntil=0;attackLockUntil=0;skillUsed=false;babyNext=false;buffUntil=0;stunnedUntil=0;skillReadyAt=Date.now()+5000;opponent=['dad','gyaru','baby'].filter(x=>x!==selected)[Math.floor(Math.random()*2)];running=true;$('selectScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');$('playerImg').src=chars[selected].img;$('cpuImg').src=chars[opponent].img;$('pName').textContent=chars[selected].name;$('cName').textContent=chars[opponent].name;$('command').disabled=false;$('send').disabled=false;$('command').value='';$('result').textContent='';$('log').textContent='';document.querySelectorAll('.cmd').forEach(b=>b.disabled=false);$('skill').textContent=chars[selected].skill;$('skill').disabled=true;$('skillInfo').textContent='あと5秒で使用可能';status('たいせん開始！');hud();log(chars[selected].name+' VS '+chars[opponent].name);skillTimer=setInterval(()=>{let remain=Math.max(0,Math.ceil((skillReadyAt-Date.now())/1000));$('skill').disabled=skillUsed||remain>0;$('skillInfo').textContent=skillUsed?'使用済み':remain?'あと'+remain+'秒で使用可能':'特性を使える！'},150);cpuTurn();setTimeout(()=>$('command').focus(),120)});
$('send').addEventListener('click',submit);$('command').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}});
document.querySelectorAll('.cmd').forEach(b=>b.addEventListener('click',()=>attack(b.dataset.cmd)));
$('skill').addEventListener('click',()=>{if(!running||skillUsed||Date.now()<skillReadyAt)return;skillUsed=true;$('skill').disabled=true;animate('player','skill','必殺！');if(selected==='dad'){stunnedUntil=Date.now()+1800;log('ピカピカビーム！CPUを1.8秒スタン！')}if(selected==='gyaru'){buffUntil=Date.now()+5000;log('鬼メイク！5秒間攻撃力1.5倍！')}if(selected==='baby'){babyNext=true;log('超・夜泣き！次の攻撃が3倍！')}status(chars[selected].skill+' 発動！')});
})();
</script></body></html>
